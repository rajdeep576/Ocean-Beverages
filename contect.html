<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Luxury Hotel</title>
    <link rel="stylesheet" href="contect.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
       
    </header>

    <main>
        <section id="contact">
            <h2>Get in Touch</h2>
            <form action="#" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section id="info">
            <h2>Contact Information</h2>
            <p><strong>Address:</strong> 123 Luxury St, Paradise City, CA 90210</p>
            <p><strong>Phone:</strong> (123) 456-7890</p>
            <p><strong>Email:</strong> <a href="mailto:info@luxuryhotel.com">info@luxuryhotel.com</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Luxury Hotel. All rights reserved.</p>
    </footer>
</body>
</html>
